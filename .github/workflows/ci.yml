name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Build the app
        run: >
          xcodebuild -project DollPlus.xcodeproj -scheme DollPlus -configuration Debug
          -destination "platform=macOS,arch=$(uname -m)" -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO build

      - name: Build the Release app
        run: >
          xcodebuild -project DollPlus.xcodeproj -scheme DollPlus -configuration Release
          -destination "platform=macOS,arch=$(uname -m)" -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO build

      - name: Check the identity of each product
        run: |
          check() {
            info="build/DerivedData/Build/Products/$1/$2.app/Contents/Info.plist"
            for pair in "CFBundleIdentifier=$3" "CFBundleName=$2" "CFBundleDisplayName=$2"; do
              key="${pair%%=*}" expected="${pair#*=}"
              actual="$(plutil -extract "$key" raw "$info")"
              [ "$actual" = "$expected" ] || { echo "$info: $key is '$actual', expected '$expected'"; exit 1; }
            done
          }
          check Debug "Doll Plus Dev" com.matikka96.DollPlus.dev
          check Release "Doll Plus" com.matikka96.DollPlus

      - name: Test MonitorCore
        run: swift test --package-path MonitorCore

      - name: Build the end-to-end fixtures and the Dock probe
        run: python3 -I scripts/e2e.py build --skip-app
